name: VIA DeSo protocol signal watch
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          DESO_SDK: "3.4.1"
        with:
          script: |
            const sdk = require('./package.json').dependencies['deso-protocol'];
            const sources = [
              { key: 'sdk', url: 'https://registry.npmjs.org/deso-protocol/latest', parse: x => x.version },
              { key: 'core', url: 'https://api.github.com/repos/deso-protocol/core/commits?per_page=1', parse: x => Array.isArray(x) ? x[0]?.sha : null },
            ];
            const signals = [];
            const checks = [];
            for (const source of sources) {
              try {
                const response = await fetch(source.url, { headers: { 'User-Agent': 'VIA-protocol-watch', Accept: 'application/json' }, signal: AbortSignal.timeout(10000) });
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const value = source.parse(await response.json());
                if (!value) throw new Error('missing source value');
                signals.push({ key: source.key, value, source: source.url });
              } catch (error) { checks.push(source.key + ': ' + String(error)); core.warning(source.key + ': ' + String(error)); }
            }
            try {
              const response = await fetch('https://api.osv.dev/v1/query', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ package: { name: 'deso-protocol', ecosystem: 'npm' }, version: sdk }),
                signal: AbortSignal.timeout(10000),
              });
              if (!response.ok) throw new Error('HTTP ' + response.status);
              const result = await response.json();
              for (const vuln of result.vulns ?? []) signals.push({ key: 'osv', value: vuln.id, source: 'https://osv.dev/vulnerability/' + encodeURIComponent(vuln.id) });
            } catch (error) { checks.push('OSV: ' + String(error)); core.warning('OSV: ' + String(error)); }
            // Availability and API-shape probes; read-only, no keys, no signing.
            for (const probe of [
              { key: 'identity', url: 'https://identity.deso.org', options: { method: 'GET', redirect: 'manual' } },
              { key: 'api', url: 'https://node.deso.org/api/v0/get-app-state', options: { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' } },
            ]) {
              try {
                const response = await fetch(probe.url, { ...probe.options, signal: AbortSignal.timeout(10000) });
                if (response.status < 200 || response.status >= 500) throw new Error('HTTP ' + response.status);
                if (probe.key === 'api') {
                  if (!response.ok) throw new Error('HTTP ' + response.status);
                  const body = await response.json();
                  if (!body || typeof body !== 'object' || Array.isArray(body) || !Object.keys(body).length) throw new Error('unexpected response shape');
                }
              } catch (error) {
                checks.push(probe.key + ': ' + String(error));
                core.warning(probe.key + ': ' + String(error));
              }
            }
            if (checks.length) core.setFailed('One or more DeSo monitor sources could not be verified: ' + checks.join('; '));
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
            for (const signal of signals) {
              if (signal.key === 'sdk' && signal.value === sdk) continue;
              const marker = '<!-- via-protocol:' + signal.key + ':' + signal.value + ' -->';
              if (existing.some(issue => !issue.pull_request && issue.body?.includes(marker))) continue;
              const title = signal.key === 'core' ? 'VIA review: DeSo core change ' + signal.value.slice(0, 12) : signal.key === 'sdk' ? 'VIA review: DeSo SDK ' + signal.value : 'VIA security review: ' + signal.value;
              await github.rest.issues.create({
                owner, repo, title,
                body: marker + '\nAutomatisch bronsignaal; dit is GEEN bevestigde incompatibiliteit.\n\nBron: ' + signal.source + '\nVIA SDK: ' + sdk + '\n\nControleer handmatig impact op Identity, spending limits, transacties, diamonds, Postkantoor, notificaties en NFT. Geen automatische upgrade, merge of deploy.',
              });
            }
